<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Favicon</title>
  <style>
    body { margin: 0; padding: 20px; background: #f0f0f0; }
    #canvas { border: 1px solid #ccc; }
  </style>
</head>
<body>
  <canvas id="canvas" width="32" height="32"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Background
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, 32, 32);
    
    // Border
    ctx.strokeStyle = '#155DFC';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, 30, 30);
    
    // Scale and translate for the paths
    ctx.save();
    ctx.translate(5, 6);
    ctx.scale(0.7, 0.7);
    
    ctx.strokeStyle = '#155DFC';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // M
    ctx.beginPath();
    ctx.moveTo(1.2, 20.2);
    ctx.lineTo(1.2, 9.43);
    ctx.lineTo(6.42, 14.6);
    ctx.lineTo(11.2, 5.2);
    ctx.lineTo(11.2, 20.2);
    ctx.stroke();
    
    // U
    ctx.beginPath();
    ctx.moveTo(14.2, 1.2);
    ctx.lineTo(14.2, 15.69);
    ctx.quadraticCurveTo(14.2, 20.2, 18.7, 20.2);
    ctx.quadraticCurveTo(23.2, 20.2, 23.2, 15.69);
    ctx.lineTo(23.2, 8.97);
    ctx.stroke();
    
    // X
    ctx.beginPath();
    ctx.moveTo(26.2, 8.27);
    ctx.lineTo(35.2, 20.2);
    ctx.moveTo(35.2, 1.2);
    ctx.lineTo(26.2, 20.2);
    ctx.stroke();
    
    // I
    ctx.beginPath();
    ctx.moveTo(4.2, 22.2);
    ctx.lineTo(4.2, 36.2);
    ctx.stroke();
    
    // O
    ctx.beginPath();
    ctx.ellipse(11.7, 30.2, 4.5, 6, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // N
    ctx.beginPath();
    ctx.moveTo(19.2, 36.2);
    ctx.lineTo(19.2, 25.18);
    ctx.lineTo(30.2, 36.2);
    ctx.lineTo(30.2, 20.2);
    ctx.stroke();
    
    ctx.restore();
  </script>
</body>
</html>
